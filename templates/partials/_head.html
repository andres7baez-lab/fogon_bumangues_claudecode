<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El Fogón">
<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('static', filename='img/favicon-32.png') }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/fogon.css') }}">

{# Antes de pintar: tema guardado y no repetir la pantalla de carga en la misma sesión #}
<script>try{var t=localStorage.getItem('fg:tema');if(t)document.documentElement.setAttribute('data-theme',t);if(sessionStorage.getItem('fg:splash'))document.documentElement.classList.add('fg-no-splash')}catch(e){}</script>
<script src="{{ url_for('static', filename='js/fogon.js') }}" defer></script>
